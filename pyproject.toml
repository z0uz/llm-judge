[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-judge"
version = "0.1.0"
description = "Modular LLM Vulnerability Assessment Framework mapped to OWASP GenAI Top 10 (2026)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
    "jinja2>=3.1.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "build==1.2.2.post1",
]
ui = [
    "gradio>=4.0.0",
]

[project.scripts]
llm-judge = "llm_judge.cli:main"
llm-judge-ui = "llm_judge.ui:main"

[tool.setuptools.packages.find]
where = ["src"]
