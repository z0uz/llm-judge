<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LLM Judge — OWASP GenAI Top 10 (2026) Red-Team Console</title>
  <meta name="description" content="Interactive OWASP GenAI Top 10 (2026) LLM red-teaming console with 20 multi-turn probes, payload mutators, multi-trial ASR, strict LLM-as-a-Judge, report diffing, and SARIF 2.1.0 export." />
  <link rel="icon" type="image/png" href="icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4f7fb;
      --surface: #ffffff;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --ink: #0f172a;
      --muted: #64748b;
      --primary: #2563eb;
      --indigo: #4f46e5;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
    }
    body {
      background-image: radial-gradient(ellipse 80% 35% at 50% -12%, rgba(37, 99, 235, 0.09), transparent 70%);
      display: flex;
      flex-direction: column;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    .topbar-inner {
      max-width: 1400px;
      margin: 0 auto;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--ink);
    }
    .brand img {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.16);
    }
    .brand-title {
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .pill {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 0.68rem;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 13px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--ink);
      transition: all 0.15s ease;
    }
    .btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: #eff6ff;
    }
    .btn-primary {
      background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
      border-color: #1d4ed8;
      color: #ffffff;
      box-shadow: 0 3px 12px rgba(37, 99, 235, 0.25);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #1d4ed8 0%, #4338ca 100%);
      color: #ffffff;
      border-color: #1d4ed8;
    }
    .cmd-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 11px;
      border-radius: 8px;
      background: #f8fafc;
      border: 1px solid var(--border);
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 0.74rem;
      color: #334155;
      cursor: pointer;
    }
    .cmd-chip:hover { border-color: var(--primary); color: var(--primary); }
    .workspace {
      flex: 1;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 16px 20px 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .frame-shell {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 10px 30px rgba(15, 23, 42, 0.06);
      min-height: calc(100vh - 118px);
      display: flex;
    }
    iframe.space-embed {
      width: 100%;
      min-height: calc(100vh - 118px);
      border: 0;
      display: block;
      background: var(--bg);
    }
    .note {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.78rem;
      color: var(--muted);
      padding: 0 4px;
    }
    .note a { color: var(--primary); text-decoration: none; font-weight: 600; }
    .note a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="https://github.com/z0uz/llm-judge" target="_blank" rel="noopener">
        <img src="icon.png" alt="LLM Judge" />
        <span class="brand-title">LLM Judge</span>
        <span class="pill">OWASP GenAI 2026</span>
      </a>

      <div class="actions">
        <button class="cmd-chip" id="copy-cli" type="button" title="Copy pip install command">
          <span>pip install git+https://github.com/z0uz/llm-judge.git</span>
        </button>
        <a class="btn" href="https://github.com/z0uz/llm-judge" target="_blank" rel="noopener">GitHub Repo</a>
        <a class="btn btn-primary" href="https://huggingface.co/spaces/elsiddik/llm-judge" target="_blank" rel="noopener">Open Fullscreen on HF</a>
      </div>
    </div>
  </header>

  <main class="workspace">
    <div class="frame-shell">
      <iframe
        class="space-embed"
        src="https://elsiddik-llm-judge.hf.space"
        title="LLM Judge — Interactive OWASP GenAI Security Console"
        allow="clipboard-write"
        loading="eager"
      ></iframe>
    </div>
    <div class="note">
      <span>Powered by your live Hugging Face Space · Zero-retention BYOK (keys stay in-memory per scan)</span>
      <span>Having trouble loading? <a href="https://elsiddik-llm-judge.hf.space" target="_blank" rel="noopener">Launch direct app →</a></span>
    </div>
  </main>

  <script>
    const copyBtn = document.getElementById('copy-cli');
    if (copyBtn) {
      copyBtn.addEventListener('click', async () => {
        const cmd = 'pip install git+https://github.com/z0uz/llm-judge.git';
        try {
          await navigator.clipboard.writeText(cmd);
          copyBtn.firstElementChild.textContent = 'Copied install command!';
          setTimeout(() => { copyBtn.firstElementChild.textContent = cmd; }, 1800);
        } catch (_) {}
      });
    }
  </script>
</body>
</html>
